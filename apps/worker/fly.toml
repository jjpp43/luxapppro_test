# Staging worker. Create the Fly org in the client name before `fly launch`.
# Region sjc = San Jose, closest Fly city to Supabase us-west-2 (Oregon).
app = "lux-pro-worker-staging"
primary_region = "sjc"

[build]

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
